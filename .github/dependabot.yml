    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ise-mcp-server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
